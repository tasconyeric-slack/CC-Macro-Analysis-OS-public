[project]
name = "cnmacro"
version = "0.1.0"
description = "CC Macro Analysis OS: traceable, falsifiable China macro research engine"
requires-python = ">=3.14,<3.15"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "jinja2>=3.1", "markdown>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
