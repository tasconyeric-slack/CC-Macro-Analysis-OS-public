<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<div class="mr-scrim" style="min-height:540px;box-sizing:border-box">
  <div class="mr-modal" role="dialog" aria-labelledby="t">
    <button class="mr-icon-btn mr-modal__close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 1 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4z"/></svg></button>
    <h2 class="mr-modal__title" id="t">Welcome</h2>
    <p class="mr-modal__sub">Find new ideas to try</p>
    <div class="mr-stack">
      <label class="mr-field"><span class="mr-field__label">Email</span><input class="mr-input" placeholder="Email"></label>
      <label class="mr-field"><span class="mr-field__label">Password</span><input class="mr-input" type="password" placeholder="Create a password"></label>
      <button class="mr-btn mr-btn--primary mr-btn--block">Continue</button>
    </div>
    <p class="mr-modal__foot">Already a member? <a class="mr-link" href="#">Log in</a></p>
  </div>
</div>
</body>
</html>
