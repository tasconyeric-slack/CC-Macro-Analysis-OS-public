name: one-time approved diagnostic branch cleanup
on:
  push:
    branches: [claude/news-v31]
    paths: [.github/workflows/cleanup-news-probe.yml]
permissions:
  contents: write
jobs:
  delete-diagnostic-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete only news-probe-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/news-probe-results"
