name: checks

on:
  push:
  # GitHub-token-created signed checkpoints trigger synchronize events that GitHub
  # marks action_required, without running jobs. Instead dispatch checks explicitly.
  # Same-repo edits still run on push; fork PRs run when first opened/reopened.
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:  # Re-run CI on GitHub-signed Codex checkpoint heads

permissions:
  contents: read

jobs:
  boundary:
    name: secrets / data-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Secrets and data-boundary check (tracked files)
        run: python3 scripts/check_secrets.py

  history-secrets:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history (redacted output)
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/report" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --no-banner --report-format json --report-path /report/gitleaks.json
          status=$?
          set -e
          if [ -f "$RUNNER_TEMP/gitleaks.json" ]; then
            python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "gitleaks.json").read_text())
          counts = collections.Counter((x.get("File", "?"), x.get("RuleID", "?")) for x in report)
          print(f"Gitleaks findings: {len(report)} (metadata only; secrets never printed)")
          for (path, rule), n in counts.most_common(25):
              print(f"{n:>3}  {rule}  {path}")
          PY
          fi
          exit "$status"

  engine:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # E4 needs the full history of preregistered files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python version (the requires-python baseline)
        run: python -VV
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Eval gate (public mode; any deterministic failure fails CI, warnings do not)
        run: python -m cnmacro check --public
      - name: Build public site
        run: python site/build.py
      - name: Verify site/dist/index.html
        run: test -s site/dist/index.html
