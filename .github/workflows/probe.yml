name: source reachability probe

# Measures which official/public hosts GitHub-hosted runners can reach.
on:
  push:
    paths: ["scripts/probe_sources.py", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/probe_sources.py --events --out probe.json --summary "$GITHUB_STEP_SUMMARY" --response-dir probe-responses
      - run: cat probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-probe
          path: |
            probe.json
            probe-responses/
