name: prices archive probe
on:
  push:
    branches: [codex/prices-depth]
    paths: [scripts/probe_price_releases.py, .github/workflows/prices-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/probe_price_releases.py .prices-probe
      - name: Push temporary diagnostic branch
        run: |
          git switch -c codex/prices-probe-browser-results
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .prices-probe
          git commit -m "diagnostic: runner NBS archive responses"
          git push origin HEAD:refs/heads/codex/prices-probe-browser-results
