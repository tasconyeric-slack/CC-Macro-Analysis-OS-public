name: prices transport diagnosis
on:
  push:
    branches: [codex/prices-depth]
    paths: [scripts/probe_price_variants.py, .github/workflows/prices-variants.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/probe_price_variants.py
      - run: |
          git switch -c codex/prices-variants-${{ github.run_id }}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .prices-variants
          git commit -m "diagnostic: runner responses for NBS release transport variants"
          git push origin HEAD
