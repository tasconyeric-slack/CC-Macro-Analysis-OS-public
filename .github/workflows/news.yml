name: public macro news
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and run the optional AI step, but publish nothing (acceptance runs)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["src/cnmacro/news_feed.py", "src/cnmacro/news_rank.py", "src/cnmacro/news_ai.py", "scripts/fetch_macro_news.py", ".github/workflows/news.yml"]
permissions:
  contents: write
concurrency:
  group: public-macro-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .
      - name: Collect public macro reporting
        id: collect
        continue-on-error: true
        # Owner switches (Settings > Secrets and variables > Actions > Variables); see docs/runbooks/news-ai.md.
        # Unset variables arrive as empty strings and mean off. The key is a secret and only this step can read it.
        env:
          NEWS_AI_ENABLED: ${{ vars.NEWS_AI_ENABLED }}
          NEWS_AI_DISPLAY_ENABLED: ${{ vars.NEWS_AI_DISPLAY_ENABLED }}
          NEWS_AI_MODEL: ${{ vars.NEWS_AI_MODEL }}
          NEWS_AI_MAX_ITEMS: ${{ vars.NEWS_AI_MAX_ITEMS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/fetch_macro_news.py
      - name: Publish the public snapshot
        if: github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- data/news
          python scripts/commit_macro_news.py
      - name: Report source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
