name: one-time prices verified preview
on:
  push:
    branches: [codex/prices-depth]
    paths: [.github/workflows/prices-preview-checkpoint.yml]
permissions:
  contents: write
  actions: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch='codex/prices-depth';
            const reviewed='0525b45b3396f9cdc6f8b458b1b7693534fd15c3';
            const ref='heads/'+branch;
            const current=await github.rest.git.getRef({owner,repo,ref});
            if(current.data.object.sha!==context.sha) throw new Error('Branch advanced; do not overwrite');
            const comparison=await github.rest.repos.compareCommits({owner,repo,base:reviewed,head:context.sha});
            if(comparison.data.commits.length!==1 || comparison.data.files.length!==1 ||
               comparison.data.files[0].filename!=='.github/workflows/prices-preview-checkpoint.yml' ||
               comparison.data.files[0].status!=='added') throw new Error('Helper must be the only change');
            const target=await github.rest.git.getCommit({owner,repo,commit_sha:reviewed});
            // Restoring the reviewed tree removes this temporary workflow.
            // All product/data files remain byte-for-byte identical to reviewed.
            const created=await github.rest.git.createCommit({owner,repo,
              message:'ci: verified prices preview checkpoint; remove one-time helper',
              tree:target.data.tree.sha,parents:[context.sha]});
            const proof=await github.rest.repos.getCommit({owner,repo,ref:created.data.sha});
            if(!proof.data.commit.verification.verified || proof.data.commit.verification.reason!=='valid' ||
               proof.data.author?.login!=='github-actions[bot]' || proof.data.commit.tree.sha!==target.data.tree.sha)
              throw new Error('Refuse an unverified or changed product tree');
            const again=await github.rest.git.getRef({owner,repo,ref});
            if(again.data.object.sha!==context.sha) throw new Error('Branch advanced during signing');
            await github.rest.git.updateRef({owner,repo,ref,sha:created.data.sha,force:false});
            core.info('Verified checkpoint '+created.data.sha+'; reviewed identical tree '+target.data.tree.sha);
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'checks.yml',ref:branch});
