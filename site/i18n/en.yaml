method:
  h1: How the system keeps itself honest
  chain_title: Research chain
  chain: "Observation → surprise → marginal change → decomposition → mechanism → cross-check → research view → asset implication → evidence test. Every interpretation answers ten questions, from \"compared with what?\" to \"what print would prove this wrong?\""
  lenses: "Four lenses keep the wording honest. Level: where an indicator stands. Marginal change: which way it is moving now, which cumulative series can hide. Breadth: whether the move is shared. Mechanism: what drives it. A claim that mixes them is rewritten before it is published."
  flow_title: From data to thesis
  flow:
    obs_t: Observations
    obs: "Append-only rows with release date, retrieval time and source class. Unknown release dates are recorded as unknown, never guessed."
    claims_t: Claims
    claims: "Numbers enter prose only as bound references to observations or derived values. Each claim is typed Fact, Derived, External view or Inference, and exists in both languages with the same bindings."
    thesis_t: Thesis
    thesis: "{n} evidence tests move hypotheses; preregistered terminal rules move the thesis. Probability changes in 5-point steps, always with reasons."
  auto_title: Automatic refresh vs analyst judgment
  auto: "A scheduled job checks the official release calendar twice a day. When a release is due it fetches the new data from the official source, appends only genuinely new observations (a revised value is kept as a new vintage), re-runs every evidence test against the preregistered case, records which tests flipped, runs the eval below and rebuilds this site. Running it again with nothing new does nothing."
  auto_a_t: Updated automatically
  auto_a: "Observations, derived values, evidence-test outcomes, the terminal-rule check, charts and a factual record of what changed. A preregistered terminal rule is the only automatic way the thesis status can change."
  auto_b_t: Changed only by the analyst
  auto_b: "Probability and confidence. After a release the analyst appends an update saying whether it changes the thesis; any probability change must cite evidence and reasoning or the eval fails. The refresh only offers a mechanical tally of the direction of test flips."
  latest_refresh: "Latest refresh {when}"
  reachable: reachable
  unreachable: unreachable
  ai:
    title: Where AI is used, and where it is forbidden
    intro: "Three jobs are kept apart. Deterministic software establishes what happened. An AI Research Copilot interprets what it means. The analyst decides what to believe. The Copilot is in shadow mode: every run is recorded for audit and evaluation, and nothing it writes is shown on this site as the research view unless the analyst accepts it."
    col_task: Task
    col_who: Done by
    col_check: Checked by
    r1_task: "Fetching and calculating data, vintages and as-of dates, evidence-test outcomes, terminal rules, and finding which observations and tests changed"
    r1_who: Software
    r1_check: "Eval gate E0 to E5, unit tests, historical replay"
    r2_task: "Writing numbers into text"
    r2_who: "Software. The AI writes only references to evidence; code fills in the values"
    r2_check: "A closed list of evidence ids for each run; any figure typed by the model fails validation"
    r3_task: "Judging whether a change is material, mapping it to the hypotheses, naming the strongest competing explanation, what the evidence does not prove, and the next research questions"
    r3_who: "AI Research Copilot: two bounded calls, a draft and then a challenge"
    r3_check: "Hard validation of every output, then analyst review"
    r4_task: "Probability, conviction and every change to the thesis"
    r4_who: Analyst
    r4_check: "Thesis discipline check E5; append-only, time-stamped updates"
    forbidden_title: What the AI never does
    f1: "Type a data figure, or recompute an indicator in prose"
    f2: "Decide whether a terminal rule has fired, or change a preregistered rule or the mechanical direction of an evidence test"
    f3: "Output or change a probability or a conviction"
    f4: "Cite evidence outside the list the software supplies, or anything dated after the information set"
    f5: "Publish. An answer that fails validation is discarded, and a run without a complete record is not used"
    status: "Copilot v0 is in shadow mode. A historical replay tests interpretation under a given framework, not the framework's predictive power, and is never presented as live evidence."
  eval_title: Deterministic eval
  eval_meta_html: 'Generated {when} · commit <span class="mono">{commit}</span> · {mode} mode'
  eval:
    col_check: Check
    col_proves: What it proves
    col_status: Status
  no_eval: No eval report yet.
  eval_note: "These checks are deterministic code. A model grading its own research is not treated as evidence of correctness."
  limits_title: Known data limitations
  sources_title: Data sources and boundary
  boundary: "Private Research Mode consumes Wind and licensed research through a local-only V1.2 Phase 1 integration and runs private diagnostics on top of it (Phase 2, also local-only); it is not required for the public V1. This public site is built only from official and open sources and tracked research artifacts. A claim that depends on licensed data shows as withheld rather than disappearing."
  sources:
    col_source: Source
    col_status: Status
  budget_title: Metric budget
  budget_text: "{core} core metrics, evaluated in every run, and {diag} diagnostics, pulled only when a core signal needs decomposition."
  budget:
    col_metric: Metric
    col_tier: Tier
    col_serves: Serves
    col_why: Why it is here
    col_source: Source

