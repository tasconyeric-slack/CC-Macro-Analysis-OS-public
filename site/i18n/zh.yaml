method:
  h1: 系统如何保持严谨
  chain_title: 研究链条
  chain: "观测 → 意外 → 边际变化 → 分解 → 传导机制 → 交叉验证 → 研究观点 → 资产含义 → 证据检验。每一项解读都要回答十个问题，从“和什么比？”到“什么样的数据会证明它是错的？”。"
  lenses: "四个视角让措辞保持准确。水平：指标当前所处的位置。边际变化：它眼下的运行方向，累计类序列可能掩盖这一点。广度：变化是否具有普遍性。传导机制：驱动力量是什么。把它们混在一起的结论，在发布前会被改写。"
  flow_title: 从数据到命题
  flow:
    obs_t: 观测值
    obs: "只增不改的记录，包含发布日期、抓取时间和来源类别。未知的发布日期如实记为未知，绝不猜测。"
    claims_t: 结论
    claims: "数字只能以绑定到观测值或推算值的引用形式进入文字。每条结论分为事实、推算、外部观点或推断，并以相同的绑定同时提供中英文两个版本。"
    thesis_t: 命题
    thesis: "{n} 项证据检验作用于各假设；预先登记的终点规则决定命题状态。概率以5个百分点为步长变动，且必须附有理由。"
  auto_title: 自动刷新与分析师判断
  auto: "定时任务每天两次核对官方发布日历。有发布到期时，它从官方来源抓取新数据，只追加真正新增的观测值（修订值作为新版本保留），对照预先登记的案例重新运行全部证据检验，记录哪些检验发生翻转，运行下方的评估，并重新构建本站。没有新数据时再次运行不会产生任何改动。"
  auto_a_t: 自动更新的内容
  auto_a: "观测值、推算值、证据检验结果、终点规则检查、图表，以及对变化的事实性记录。预先登记的终点规则是命题状态唯一可以自动变化的途径。"
  auto_b_t: 只由分析师改变的内容
  auto_b: "概率和置信度。每次发布之后，分析师追加一条更新，说明其是否改变命题；任何概率变动都必须引用证据并给出理由，否则评估失败。刷新任务只提供检验翻转方向的机械统计。"
  latest_refresh: "最近一次刷新：{when}"
  reachable: 可访问
  unreachable: 无法访问
  ai:
    title: AI 用在哪里，又禁止用在哪里
    intro: "三类工作彼此分开。确定性软件负责确认发生了什么；AI 研究助手负责解读其含义；分析师负责决定相信什么。AI 助手目前处于影子模式：每次运行都会记录下来用于审计和评估，除非分析师采纳，否则它写的任何内容都不会作为研究观点显示在本站。"
    col_task: 工作
    col_who: 由谁完成
    col_check: 如何检查
    r1_task: "抓取与计算数据、数据版本与时点、证据检验结果、终点规则，以及找出哪些观测值和检验发生了变化"
    r1_who: 软件
    r1_check: "评估关卡 E0 至 E5、单元测试、历史回放"
    r2_task: "把数字写进文字"
    r2_who: "软件。AI 只写对证据的引用，数值由代码填入"
    r2_check: "每次运行都有一份封闭的证据编号清单；模型自行写出的任何数字都无法通过校验"
    r3_task: "判断变化是否重要、将其对应到各假设、提出最强的替代解释、说明证据不能证明什么，以及下一步的研究问题"
    r3_who: "AI 研究助手：两次有边界的调用，先起草，再质疑"
    r3_check: "对每份输出做硬性校验，再由分析师审阅"
    r4_task: "概率、置信度，以及对命题的每一次改动"
    r4_who: 分析师
    r4_check: "命题纪律检查 E5；只增不改、带时间戳的更新"
    forbidden_title: AI 绝不会做的事
    f1: "写出任何数据数字，或在文字中重新计算指标"
    f2: "判定终点规则是否触发，或修改预先登记的规则及证据检验的机械方向"
    f3: "输出或修改概率或置信度"
