    f5: "对外发布。未通过校验的答案会被丢弃，记录不完整的运行不予采用"
    status: "AI 助手 v0 处于影子模式。历史回放检验的是在既定框架下的解读能力，而非框架的预测力，绝不会被当作实时证据。"
