# Global-China Macro Data Dictionary v0.1 (case: cn-nominal)
#
# Budget: <= 24 core + <= 6 diagnostic. Core metrics are evaluated in every thesis run;
# diagnostics are pulled only when a core signal needs decomposition or a cross-check.
# Every metric names the hypothesis it serves (H0-H4) and why it earns its place.
#
# source_code / wind.code are filled only from lookups: FRED ids below are confirmed by the
# first successful pull (fetch log in data/demo/SOURCES.md); Wind codes come from the
# capability spike (docs/wind-capability-note.md). Never guess a code.
# redistribution: public = official/open source usable in the public demo;
#                 private_only = licensed, research mode only; unclear = treat as private.
#
# Tiers: core and diagnostic are the budgeted public thesis evidence (above). `supplemental`
# is a third tier for private research diagnostics: it does not count against that budget and
# can never feed a preregistered evidence test or terminal rule automatically. The public site
# does not list supplemental metrics.
#
# wind: the one place a Wind route is pinned (data/dictionary/wind_runtime.yaml holds the
# runtime pin and the request windows). Normal refresh never searches for codes; it fails closed
# (WIND_METADATA_DRIFT) if the provider's name, frequency or unit differ from `expected_*`.
# A field Wind does not supply is declared in `known_gaps`, not special-cased in code.

metrics:
# ---------------- Target and price (H1, H0) ----------------
- metric_id: cn_ngdp_q
  category: growth
  name: Nominal GDP, single quarter, current prices
  name_zh: 国内生产总值（当季，现价）
  tier: core
  frequency: Q
  unit: CNY 100m
  transform: level
  hypotheses: [H1, H2]
  role: Target variable. With real GDP it gives nominal growth and the implied deflator.
  role_zh: 目标变量。与实际GDP结合，可得名义增速和隐含平减指数。
  source_primary: NBS
  source_code: "nbs:28d936104e304aa191e338eb82b6dc09/d22612f09aeb4241bc557ef0ac61b3ba"
  release: NBS calendar, quarterly GDP release (~mid-month after quarter end)
  redistribution: public
  caliber_notes:
    - NBS publishes cumulative current-price GDP; single-quarter levels are published alongside or derived as differences.
    - Historical levels are revised after economic censuses; YoY must use same-vintage levels.

- metric_id: cn_rgdp_yoy
  category: growth
  name: Real GDP YoY, single quarter
  name_zh: 国内生产总值不变价当季同比
  tier: core
  frequency: Q
  unit: "%"
  transform: yoy
  hypotheses: [H1, H2]
  role: Denominator of the implied deflator; real side of nominal growth.
  role_zh: 隐含平减指数的分母，名义增长中的实际部分。
  source_primary: NBS
  source_code: "nbs:f9b694c9b79e4ce5958bc88c6410fa67/170e7f00f8c24ede863c0526b42ae81f@idx100"
  release: NBS calendar, quarterly GDP release
  redistribution: public

- metric_id: cn_ppi_yoy
  category: prices
  name: PPI YoY
  name_zh: 工业生产者出厂价格指数同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H1, H0]
  role: Monthly proxy for the industrial deflator; the main high-frequency price signal.
  role_zh: 工业部门平减指数的月度替代指标，也是最主要的高频价格信号。
  source_primary: NBS
  source_code: "nbs:60e8b361f11c4a878c652a6487a25561/150633e52b9a470a9a9fd1b296dd6c5b@idx100"
  release: NBS calendar, ~9th-15th of following month
  redistribution: public
  caliber_notes:
    - YoY is distorted by base effects; read with PPI MoM.

- metric_id: cn_ppi_mom
  category: prices
  name: PPI MoM
  name_zh: 工业生产者出厂价格指数环比
  tier: core
  frequency: M
  unit: "%"
  transform: mom
  hypotheses: [H1, H0]
  role: Momentum free of base effects; distinguishes a real turn from a base-effect turn.
  role_zh: 不受基数效应影响的价格动能，用于区分真实拐点与基数效应造成的拐点。
  source_primary: NBS
  source_code: "nbs:677cfbb4f06941af8c1761c4804e58cf/e64079bae9064aebad1c4c5fe0c8a6ef@idx100"
  release: with PPI YoY
  redistribution: public

- metric_id: cn_cpi_yoy
  category: prices
  name: CPI YoY
  name_zh: 居民消费价格指数同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H1]
  role: Consumer-side price level; part of the GDP deflator.
  role_zh: 消费端价格水平，是GDP平减指数的组成部分。
  source_primary: NBS
  source_code: "nbs:5c7452825c7c4dcba391db5ca7f335c5/53180dfb9c14411ba4b762307c85920c@idx100|nbs:809d2522b0fe4be89142650341b19083/4ae9047687934a6390984c21d6ddab96@idx100|nbs:9d4eec43537742a7ab5d63db97fa2f51/e5c318ffdbbc4d38898e52b52267eb25@idx100"
  release: NBS calendar, with PPI
  redistribution: public
  caliber_notes:
    - Food (pork) and Lunar New Year timing dominate headline swings; read with core CPI.

- metric_id: cn_core_cpi_yoy
  category: prices
  name: Core CPI YoY (ex food and energy)
  name_zh: 扣除食品和能源价格后的核心CPI同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H2, H0]
  role: Demand-driven price pressure; key discriminator between H2 (demand recovery) and H0 (supply-only).
  role_zh: 需求拉动的价格压力，是区分H2（需求复苏）与H0（仅供给端）的关键指标。
  source_primary: NBS
  source_code: "nbs:5c7452825c7c4dcba391db5ca7f335c5/71be3d43d2fb44188199840272463ae0@idx100|nbs:809d2522b0fe4be89142650341b19083/c2050e97c49a4763a6d0f0f38bf0b4ed@idx100"
  release: with CPI
  redistribution: public

- metric_id: cn_pmi_output_price
  category: pmi
  name: Manufacturing PMI, output prices
  name_zh: 制造业PMI出厂价格指数
  tier: core
  frequency: M
  unit: index (50 = no change)
  transform: level
  hypotheses: [H1]
  role: Leads PPI MoM by roughly one release; earliest price read each month.
  role_zh: 大致领先PPI环比一期，是每月最早的价格读数。
  source_primary: NBS
  source_code: "nbs:93ffbb1aa85740d3aa2618371508b606/105a73cd48cc47d4a914ebccdedf24ec"
  release: NBS calendar, last day of the reference month
  redistribution: public

# ---------------- Domestic demand (H2) ----------------
- metric_id: cn_m1_yoy
  category: credit
  name: M1 YoY
  name_zh: M1同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H2]
  role: Corporate and household transaction balances; a leading read on private activity.
  role_zh: 企业和居民的交易性存款余额，是私人部门活动的领先指标。
  source_primary: PBOC
  source_code: "nbs:82130c6621a745cda3d64b090e733383/640401d3351b4b868dea28f89f410a54"
  release: PBOC, no fixed calendar (usually ~10th-15th); record actual release date
  redistribution: public
  caliber_notes:
    - From January 2025 PBOC broadened M1 (adds household demand deposits and payment-institution customer reserves). YoY across the break is not like-for-like; flag comparisons spanning it.

- metric_id: cn_loans_hh_mlt_ytd
  category: credit
  name: New RMB loans to households, medium and long term, year-to-date
  name_zh: 住户中长期贷款新增（年初至今）
  tier: core
  frequency: M
  unit: CNY 100m
  transform: cumulative_level
  hypotheses: [H2]
  role: Mortgage demand; the cleanest private-credit read on households. Use single() for monthly flow.
  role_zh: 按揭需求，是观察居民部门私人信贷最干净的指标；月度流量由single()函数得到。
  source_primary: PBOC
  release: with PBOC monetary statistics
  redistribution: public
  caliber_notes:
    - Early mortgage repayment depresses net new lending independently of new demand.

- metric_id: cn_retail_sales_yoy
  category: growth
  jan_feb_combined: true
  name: Retail sales of consumer goods YoY
  name_zh: 社会消费品零售总额当月同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H2]
  role: Nominal household consumption.
  role_zh: 居民名义消费。
  source_primary: NBS
  source_code: "nbs:d0cb882c7f27443ab6b3ef9421901961/aaac57d54d2e465d91bc9f3ea1a8618e"
  release: NBS calendar, monthly activity release
  redistribution: public
  caliber_notes:
    - January and February published combined; trade-in subsidy programmes distort durable goods.

- metric_id: cn_property_sales_area_ytd_yoy
  category: growth
  name: Commodity building sales area, YTD YoY
  name_zh: 商品房销售面积累计同比
  tier: core
  frequency: M
  unit: "%"
  transform: cumulative_yoy
  hypotheses: [H2]
  role: Property demand; the largest single drag on private demand since 2021.
  role_zh: 房地产需求，是2021年以来私人需求最大的单一拖累项。
  source_primary: NBS
  source_code: "nbs:0ae633cdb85f4a8397650831b2b27e50/50a37fbef1d04be68f15d82b711783bf"
  release: NBS calendar, property release (same day as activity data)
  redistribution: public
  caliber_notes:
    - YoY is computed by NBS on a comparable basis; it will not match YoY computed from published levels.

- metric_id: cn_ind_profit_ytd_yoy
  category: growth
  name: Industrial enterprise profits, YTD YoY
  name_zh: 规模以上工业企业利润总额累计同比
  tier: core
  frequency: M
  unit: "%"
  transform: cumulative_yoy
  hypotheses: [H1, H2]
  role: Where price and volume meet margins; tests whether reflation reaches corporate income.
  role_zh: 价格与产量在利润率上交汇之处，检验再通胀是否传导至企业收入。
  source_primary: NBS
  source_code: "nbs:643feccdedb64e38a64c65a00c390646/9d63a27d727d4beeb32529078442cdd4"
  release: NBS calendar, ~27th of following month
  redistribution: public
  caliber_notes:
    - Comparable-basis YoY; sample of enterprises changes annually. January-February combined.

- metric_id: cn_pmi_new_orders
  category: pmi
  name: Manufacturing PMI, new orders
  name_zh: 制造业PMI新订单指数
  tier: core
  frequency: M
  unit: index (50 = no change)
  transform: level
  hypotheses: [H2]
  role: Earliest monthly demand read.
  role_zh: 最早的月度需求读数。
  source_primary: NBS
  source_code: "nbs:93ffbb1aa85740d3aa2618371508b606/4151df33b53f4d02ae9f51fe402f1a50"
  release: NBS calendar, last day of the reference month
  redistribution: public

- metric_id: cn_pmi_mfg
  category: pmi
  name: Manufacturing PMI, headline
  name_zh: 制造业采购经理指数
  tier: diagnostic
  frequency: M
  unit: index (50 = no change)
  transform: level
  hypotheses: [H2]
  role: Headline composite diffusion index for manufacturing business conditions; diagnostic context, not a preregistered evidence test.
  role_zh: 制造业景气的综合扩散指数，用作对照背景，不进入预注册证据检验。
  source_primary: NBS
  # Verified against the NBS catalog response in source probe 42507127955; no guessed identifier.
  source_code: "nbs:93ffbb1aa85740d3aa2618371508b606/a09aa989bdcf4cffa2021795722eb916"
  release: NBS calendar, last day of the reference month
  redistribution: public
  caliber_notes:
    - Headline composite diffusion index; 50 is the expansion/contraction threshold, not a growth rate.
    - The NBS metadata uses percent for the diffusion index; displayed as index points consistently with the existing PMI components.

# ---------------- Policy impulse (H3) ----------------
- metric_id: cn_tsf_stock_yoy
  category: credit
  name: Total social financing stock YoY
  name_zh: 社会融资规模存量同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H3, H2]
  role: Aggregate credit growth across loans, bonds and government debt.
  role_zh: 涵盖贷款、债券和政府债务的总体信贷增速。
  source_primary: PBOC
  release: with PBOC monetary statistics
  redistribution: public
  caliber_notes:
    - TSF coverage has been expanded several times (government bonds, ABS, write-offs). Verify each break against PBOC notes before comparing across it.

- metric_id: cn_tsf_govbond_flow
  category: fiscal
  name: TSF, government bond net financing (monthly flow)
  name_zh: 社融口径政府债券净融资（当月）
  tier: core
  frequency: M
  unit: CNY 100m
  transform: level
  hypotheses: [H3]
  role: Fiscal credit impulse; separates government-led from private credit growth.
  role_zh: 财政信用脉冲，用于区分政府主导与私人部门的信贷增长。
  source_primary: PBOC
  release: with PBOC monetary statistics
  redistribution: public

- metric_id: cn_budget_exp_ytd_yoy
  category: fiscal
  name: General public budget expenditure, YTD YoY
  name_zh: 一般公共预算支出累计同比
  tier: core
  frequency: M
  unit: "%"
  transform: cumulative_yoy
  hypotheses: [H3]
  role: Spending side of fiscal impulse.
  role_zh: 财政脉冲的支出端。
  source_primary: MOF
  source_code: "nbs:37564a0046c14c059382e3ad26a0d94f/8dc84fd764df46a294e54a7662b1a38a"
  release: MOF, mid-month, no fixed calendar; record actual date
  redistribution: public
  caliber_notes:
    - January and February combined.

# ---------------- External (H4) ----------------
- metric_id: cn_exports_usd_yoy
  category: trade
  name: Exports in USD, YoY
  name_zh: 出口金额（美元计）当月同比
  tier: core
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H4]
  role: External demand contribution to nominal growth.
  role_zh: 外需对名义增长的贡献。
  source_primary: GACC
  source_code: "nbs:7e11b47c828d4e4e925f1c5a98305558/788f44b0f310403fbd308b77d6f83890"
  release: GACC calendar, ~7th-10th of following month
  redistribution: public
  caliber_notes:
    - January and February combined. USD vs CNY terms differ by the exchange-rate change; export prices fall with PPI, so value growth mixes price and volume.

- metric_id: cn_pmi_new_export_orders
  category: pmi
  name: Manufacturing PMI, new export orders
  name_zh: 制造业PMI新出口订单指数
  tier: core
  frequency: M
  unit: index (50 = no change)
  transform: level
  hypotheses: [H4]
  role: Leading read on export momentum.
  role_zh: 出口动能的领先读数。
  source_primary: NBS
  source_code: "nbs:93ffbb1aa85740d3aa2618371508b606/fb245388740743d0974af1b00cfd27bb"
  release: with PMI
  redistribution: public

# ---------------- Global and markets (H0, H1, H3) ----------------
- metric_id: gl_brent_usd
  category: external
  name: Brent crude, monthly average
  name_zh: 布伦特原油价格（月均，美元/桶）
  tier: core
  frequency: M
  unit: USD/bbl
  transform: level
  hypotheses: [H0, H1]
  role: Imported cost-push into PPI; a supply-side price driver (H0).
  role_zh: 输入性成本推动PPI的渠道，属于供给侧价格驱动因素（H0）。
  source_primary: FRED
  source_code: POILBREUSDM
  release: monthly (IMF Primary Commodity Prices via FRED)
  redistribution: public

- metric_id: gl_copper_usd
  category: external
  name: Copper, monthly average
  name_zh: 铜价（月均，美元/吨）
  tier: core
  frequency: M
  unit: USD/metric ton
  transform: level
  hypotheses: [H0, H1]
  role: Global industrial-metals price driver of upstream PPI.
  role_zh: 推动上游PPI的全球工业金属价格因素。
  source_primary: FRED
  source_code: PCOPPUSDM
  release: monthly (IMF Primary Commodity Prices via FRED)
  redistribution: public

- metric_id: gl_usdcny
  category: external
  name: CNY per USD, monthly average
  name_zh: 美元兑人民币汇率（月均）
  tier: core
  frequency: M
  unit: CNY per USD
  transform: level
  hypotheses: [H3]
  role: Fed/USD -> CNY channel; constraint on PBOC easing room.
  role_zh: 美联储/美元→人民币的传导渠道，约束央行的宽松空间。
  source_primary: FRED
  source_code: EXCHUS
  release: monthly (Federal Reserve H.10 via FRED)
  redistribution: public

- metric_id: gl_ust10y
  category: external
  name: US 10-year Treasury yield, monthly average
  name_zh: 美国10年期国债收益率（月均）
  tier: core
  frequency: M
  unit: "%"
  transform: level
  hypotheses: [H3]
  role: US rate level; with CGB 10Y gives the China-US spread that binds PBOC policy.
  role_zh: 美国利率水平；与中国10年期国债收益率共同构成约束央行政策的中美利差。
  source_primary: FRED
  source_code: GS10
  release: monthly (Federal Reserve H.15 via FRED)
  redistribution: public

- metric_id: cn_cgb10y
  name: China 10-year government bond yield, month-end
  name_zh: 10年期国债到期收益率
  tier: core
  frequency: M
  unit: "%"
  transform: level
  hypotheses: [H1, H2, H3]
  role: Market-implied view of nominal growth; benchmark our thesis against the bond market.
  role_zh: 债券市场隐含的名义增长预期，用于把本命题与债市定价相互对照。
  source_primary: Wind
  release: daily market data; month-end value used
  redistribution: private_only
  caliber_notes:
    - Public redistribution of the CCDC curve is unclear; treat as private until confirmed.
    - Wind-delivered values are private_only (docs/data-policy.md rule 2).
    - Wind route is the China Money (中国货币网) 10Y curve, M0325687. The CCDC (中债估值中心) Wind routes are permission-blocked on this account (docs/wind-capability-note.md).
    - Stored as a month-end value, the last Wind daily observation dated inside a completed calendar month. The same Wind series is also stored daily as cn_cgb10y_daily (supplemental, private research diagnostics only), from the same call.
  wind:
    server: economic_data
    tool: query_economic_indicator_data
    code: M0325687
    expected_name: "中国:国债收益率:10年"
    expected_freq: D
    expected_unit: "%"
    priority: P0
    role: gap_fill
    evidence_use: active_diagnostic
    query_group: rates
    aggregate: month_end

# ---------------- Conditional diagnostics (<= 6) ----------------
- metric_id: cn_ppi_producer_yoy
  category: prices
  name: PPI, producer goods YoY
  name_zh: PPI生产资料同比
  tier: diagnostic
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H0, H1]
  role: Pull when PPI moves; upstream-led moves point to supply or commodity drivers (H0).
  role_zh: PPI变动时调取；若涨幅由上游主导，则指向供给或大宗商品因素（H0）。
  source_primary: NBS
  source_code: "nbs:60e8b361f11c4a878c652a6487a25561/47f8464961184392bc4f6a4b8e5b1cb5@idx100"
  release: with PPI
  redistribution: public

- metric_id: cn_ppi_consumer_yoy
  category: prices
  name: PPI, consumer goods YoY
  name_zh: PPI生活资料同比
  tier: diagnostic
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H0, H2]
  role: Pull when PPI moves; downstream pass-through suggests demand (H2) rather than supply.
  role_zh: PPI变动时调取；若向下游传导，则更像需求（H2）而非供给因素。
  source_primary: NBS
  source_code: "nbs:60e8b361f11c4a878c652a6487a25561/649b27dbffb14466a3f204e16f3c74ed@idx100"
  release: with PPI
  redistribution: public

- metric_id: cn_ip_yoy
  category: growth
  jan_feb_combined: true
  name: Industrial value added, real YoY
  name_zh: 规模以上工业增加值当月同比
  tier: diagnostic
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H0, H2]
  role: Pull when prices rise; rising prices with falling output fits supply discipline (H0).
  role_zh: 价格上涨时调取；价格上涨而产出下降，符合供给收缩（H0）的特征。
  source_primary: NBS
  source_code: "nbs:3f2e14f0542348ed9fe02476eca3450b/ef1b1765960d45a29b4d7c4ca91be916"
  release: NBS calendar, monthly activity release
  redistribution: public

- metric_id: cn_loans_corp_mlt_ytd
  category: credit
  name: New RMB loans to non-financial corporates, medium and long term, YTD
  name_zh: 企（事）业单位中长期贷款新增（年初至今）
  tier: diagnostic
  frequency: M
  unit: CNY 100m
  transform: cumulative_level
  hypotheses: [H2, H3]
  role: Pull when TSF moves; separates capex credit demand from government bond issuance.
  role_zh: 社融变动时调取；用于区分资本开支类信贷需求与政府债券发行。
  source_primary: PBOC
  release: with PBOC monetary statistics
  redistribution: public

- metric_id: cn_gov_fund_rev_ytd_yoy
  category: fiscal
  name: Government fund budget revenue, YTD YoY
  name_zh: 政府性基金预算收入累计同比
  tier: diagnostic
  frequency: M
  unit: "%"
  transform: cumulative_yoy
  hypotheses: [H2, H3]
  role: Pull when fiscal or property signals conflict; land sales link property weakness to local fiscal capacity.
  role_zh: 财政与房地产信号相互矛盾时调取；土地出让收入把房地产疲弱与地方财力联系起来。
  source_primary: MOF
  release: with MOF budget release
  redistribution: public

- metric_id: cn_exports_us_ytd_yoy
  category: trade
  name: Exports to the United States in USD, YTD YoY
  name_zh: 对美出口（美元计）累计同比
  tier: diagnostic
  frequency: M
  unit: "%"
  transform: cumulative_yoy
  caliber_notes: >-
    As published by GACC (bulletin table "Imports and Exports by Country (Region)"). The
    year-to-date rate is used rather than a single-month rate derived from levels, because a
    derived rate would mix revised current figures with first-print prior-year figures.
  hypotheses: [H4]
  role: Pull when exports move; isolates tariff-exposed demand from rerouting to other markets.
  role_zh: 出口变动时调取；用于区分受关税冲击的需求与转口至其他市场的部分。
  source_primary: GACC
  release: with GACC trade release
  redistribution: public

