- metric_id: mkt_csi300
  name: CSI 300 index, daily close
  name_zh: 沪深300指数（日收盘）
  tier: supplemental
  frequency: D
  unit: index points
  transform: level
  hypotheses: [H1, H2]
  role: Market confirmation for the asset-implication step of the analysis chain; the one equity index kept in P0.
  role_zh: 分析链中资产含义一步的市场验证；P0阶段只保留这一只股票指数。
  source_primary: Wind
  release: daily close (via Wind K-line)
  redistribution: private_only
  caliber_notes:
    - Value is the K-line MATCH column, the bar's close. Retrieved by the exact windcode, never by index name (a name resolves silently to a different instrument or to nothing).
  wind:
    server: index_data
    tool: get_index_kline
    code: "000300.SH"
    value_field: MATCH
    expected_name: null
    expected_freq: D
    expected_unit: null
    priority: P0
    role: private_primary
    evidence_use: active_diagnostic
    query_group: market
    known_gaps:
      - field: name
        reason: K-line responses carry no instrument name; identity rests on the exact windcode in the request.
      - field: unit
        reason: Wind states no unit for K-line prices (only TURNOVER, in yuan); the close is stored as unitless index points.

- metric_id: cn_cpi_consensus_wind
  name: Wind consensus forecast, China CPI YoY (experimental)
  name_zh: 万得一致预测：中国CPI当月同比（实验性）
  tier: supplemental
  frequency: M
  unit: "%"
  transform: yoy
  hypotheses: [H1]
  role: Snapshot of the market-consensus CPI forecast at each retrieval, so a surprise can be measured at the next release.
  role_zh: 每次取数时一致预测CPI的快照，以便在下一次发布时度量超预期幅度。
  source_primary: Wind
  release: forecast for the target month; snapshotted at each retrieval
  redistribution: private_only
  caliber_notes:
    - EXPERIMENTAL and snapshot-only. Wind exposes no as-of query, so a value cannot be proven to be the pre-release consensus. No evidence test, no historical-surprise analysis and no thesis update may use it until the release-time validation (docs/wind-capability-note.md section 6) has succeeded after the October 2026 release.
    - Each retrieval is kept as its own row, so several snapshots of the same target month coexist. It is a separate metric, not the consensus column of cn_cpi_yoy.
  wind:
    server: economic_data
    tool: query_economic_indicator_data
    code: M0061676
    expected_name: "万得一致预测:中国:CPI:当月同比"
    expected_freq: M
    expected_unit: "%"
    priority: P0
    role: private_primary
    evidence_use: snapshot_only
    query_group: consensus
    experimental: true

