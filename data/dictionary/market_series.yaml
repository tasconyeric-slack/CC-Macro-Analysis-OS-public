# Fetch specification for the daily market series (Tushare). One entry per metric in metrics.yaml
# (category: markets). `change` is how the page expresses a move: bp (yields, spreads) or pct (prices).
# The Owner's account (checked 2026-11-10, docs/research/market-source-matrix.md) may call only shibor, hibor, us_tycr,
# us_trycr and index_daily, about one call per interface per hour: every series below needs one of those.
# `parked` series are fully specified but NOT fetched: their interface is not permitted for this account
# (yc_cb, fx_daily, sw_daily, fut_mapping, fut_daily). To enable one after a points upgrade, move its `series` entry
# into `series` and its `metric` entry into metrics.yaml; the fetchers and tests already exist.
history_start: '2020-01-01'
lookback_days: 10
series:
- metric_id: mk_shibor_on
  change: bp
  kind: shibor
  field: 'on'
- metric_id: mk_shibor_1w
  change: bp
  kind: shibor
  field: 1w
- metric_id: mk_shibor_3m
  change: bp
  kind: shibor
  field: 3m
- metric_id: mk_shibor_1y
  change: bp
  kind: shibor
  field: 1y
- metric_id: mk_ust1y
  change: bp
  kind: us_tycr
  field: y1
- metric_id: mk_ust10y
  change: bp
  kind: us_tycr
  field: y10
- metric_id: mk_ust_slope_10y_1y
  change: bp
  kind: derived
  minus:
  - mk_ust10y
  - mk_ust1y
  decimals: 4
- metric_id: mk_ust_real10y
  change: bp
  kind: us_trycr
  field: y10
- metric_id: mk_hibor_on
  change: bp
  kind: hibor
  field: 'on'
- metric_id: mk_hibor_3m
  change: bp
  kind: hibor
  field: 3m
- metric_id: mk_csi300
  change: pct
  kind: index_daily
  ts_code: 000300.SH
  field: close
parked:
- series:
    metric_id: mk_cn_gov_1y
    change: bp
    kind: yc_cb
    ts_code: 1001.CB
    curve_type: 0
    curve_term: 1
    field: yield
  metric:
    metric_id: mk_cn_gov_1y
    category: markets
    name: China government bond yield, 1-year (ChinaBond, maturity)
    name_zh: 中债国债到期收益率：1年
    tier: diagnostic
    frequency: D
    unit: '%'
    transform: level
    hypotheses:
    - H3
    role: Short end of the China government curve; policy-rate and liquidity expectations.
    role_zh: 中国国债收益率曲线短端；反映政策利率与流动性预期。
    source_primary: Tushare
    source_code: yc_cb:1001.CB
    release: daily after market close (Tushare)
    redistribution: public
- series:
    metric_id: mk_cn_gov_10y
    change: bp
    kind: yc_cb
    ts_code: 1001.CB
    curve_type: 0
    curve_term: 10
    field: yield
  metric:
    metric_id: mk_cn_gov_10y
    category: markets
    name: China government bond yield, 10-year (ChinaBond, maturity)
    name_zh: 中债国债到期收益率：10年
    tier: diagnostic
    frequency: D
    unit: '%'
    transform: level
    hypotheses:
    - H3
    role: Benchmark long-term rate; the market's nominal growth and inflation expectation.
    role_zh: 基准长期利率；反映市场对名义增长与通胀的预期。
    source_primary: Tushare
    source_code: yc_cb:1001.CB
    release: daily after market close (Tushare)
    redistribution: public
- series:
    metric_id: mk_cn_gov_slope_10y_1y
    change: bp
    kind: derived
    minus:
    - mk_cn_gov_10y
    - mk_cn_gov_1y
    decimals: 4
  metric:
    metric_id: mk_cn_gov_slope_10y_1y
    category: markets
    name: China government curve slope, 10Y minus 1Y
    name_zh: 中国国债曲线斜率：10年减1年
    tier: diagnostic
    frequency: D
    unit: '%'
    transform: level
    hypotheses:
    - H3
    role: Term spread of the government curve, computed from the two stored yields
      on the same trade date.
    role_zh: 国债曲线期限利差，由同一交易日的两个已存收益率计算。
    source_primary: Tushare
    source_code: derived:mk_cn_gov_10y-mk_cn_gov_1y
    release: daily after market close (Tushare)
    redistribution: public
- series:
    metric_id: mk_usdcnh
    change: pct
    kind: fx_daily
    ts_code: USDCNH.FXCM
