# Fetch specification for the daily market series (Tushare). One entry per metric in metrics.yaml
# (category: markets). `change` is how the page expresses a move: bp (yields, spreads) or pct (prices).
# Endpoint names and parameters are recorded in docs/research/market-source-matrix.md.
history_start: '2020-01-01'
lookback_days: 10
series:
- metric_id: mk_cn_gov_1y
  change: bp
  kind: yc_cb
  ts_code: 1001.CB
  curve_type: 0
  curve_term: 1
  field: yield
- metric_id: mk_cn_gov_10y
  change: bp
  kind: yc_cb
  ts_code: 1001.CB
  curve_type: 0
  curve_term: 10
  field: yield
- metric_id: mk_cn_gov_slope_10y_1y
  change: bp
  kind: derived
  minus:
  - mk_cn_gov_10y
  - mk_cn_gov_1y
  decimals: 4
- metric_id: mk_shibor_on
  change: bp
  kind: shibor
  field: 'on'
- metric_id: mk_shibor_3m
  change: bp
  kind: shibor
  field: 3m
- metric_id: mk_usdcnh
  change: pct
  kind: fx_daily
  ts_code: USDCNH.FXCM
  mid_of:
  - bid_close
  - ask_close
- metric_id: mk_csi300
  change: pct
  kind: index_daily
  ts_code: 000300.SH
  field: close
- metric_id: mk_sw_nonferrous
  change: pct
  kind: sw_daily
  ts_code: 801050.SI
  field: close
  group: upstream
- metric_id: mk_sw_steel
  change: pct
  kind: sw_daily
  ts_code: 801040.SI
  field: close
  group: upstream
- metric_id: mk_sw_coal
  change: pct
  kind: sw_daily
  ts_code: 801950.SI
  field: close
  group: upstream
- metric_id: mk_sw_food
  change: pct
  kind: sw_daily
  ts_code: 801120.SI
  field: close
  group: downstream
- metric_id: mk_sw_appliances
  change: pct
  kind: sw_daily
  ts_code: 801110.SI
  field: close
  group: downstream
- metric_id: mk_sw_autos
  change: pct
  kind: sw_daily
  ts_code: 801880.SI
  field: close
  group: downstream
- metric_id: mk_copper_main
  change: pct
  kind: fut_main
  ts_code: CU.SHF
  field: close
- metric_id: mk_rebar_main
  change: pct
  kind: fut_main
  ts_code: RB.SHF
  field: close
- metric_id: mk_iron_ore_main
  change: pct
  kind: fut_main
  ts_code: I.DCE
  field: close
- metric_id: mk_ust10y
  change: bp
  kind: us_tycr
  field: y10
